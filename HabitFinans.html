<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HabitFinans</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070c09;--card:#151f1a;--text:#e8f2ee;--muted:#7b8e84;
  --green:#2BE69B;--red:#FF5C72;--amber:#FFC24B;--blue:#3FA9FF
}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px 16px 100px;min-height:100vh}
h1{font-size:24px;margin-bottom:20px}
header{margin-bottom:24px}
.hero{background:linear-gradient(135deg,var(--green),#3AF5B0);border-radius:16px;padding:20px;color:#021410;margin-bottom:20px}
.hero h2{font-size:20px;font-weight:700}
.hero p{font-size:14px;margin-top:6px;opacity:.9}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{font-size:14px;font-weight:700;margin-bottom:8px}
.card p{font-size:13px;color:var(--muted)}
button{background:var(--green);color:#021410;border:none;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;margin-top:8px}
button:active{opacity:.8}
input,textarea{width:100%;background:var(--card);border:1px solid #263329;border-radius:10px;padding:12px;color:var(--text);margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.nav-bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid #263329;padding:12px 0}
.nav-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:8px}
.nav-btn.active{color:var(--green)}
.view{display:none}
.view.active{display:block}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>HabitFinans</h1>
  <p style="font-size:13px;color:var(--muted)">Tu compañero de finanzas y hábitos</p>
</header>

<!-- INICIO -->
<div id="view-inicio" class="view active">
  <div class="hero">
    <h2>¡Hola de nuevo!</h2>
    <p>Nivel 1 • 0 / 50 XP</p>
  </div>
  <div class="card">
    <h3>📊 Resumen de hoy</h3>
    <p>Ingresos: Q 0</p>
    <p>Gastos: Q 0</p>
    <p>Hábitos completados: 0</p>
  </div>
</div>

<!-- FINANZAS -->
<div id="view-finanzas" class="view">
  <h2>💳 Finanzas</h2>
  <div class="grid full">
    <input type="text" placeholder="Descripción" id="tx-desc">
    <input type="number" placeholder="Monto (Q)" id="tx-amt">
    <select id="tx-type" style="grid-column:1/-1">
      <option value="ingreso">Ingreso</option>
      <option value="gasto" selected>Gasto</option>
    </select>
    <button onclick="addTx()" style="grid-column:1/-1">Agregar transacción</button>
  </div>
  <div id="tx-list" style="margin-top:20px"></div>
</div>

<!-- HÁBITOS -->
<div id="view-habitos" class="view">
  <h2>🌱 Hábitos</h2>
  <div class="grid full">
    <input type="text" placeholder="Nombre del hábito" id="hab-name" style="grid-column:1/-1">
    <button onclick="addHabit()" style="grid-column:1/-1">Crear hábito</button>
  </div>
  <div id="hab-list" style="margin-top:20px"></div>
</div>

<!-- METAS -->
<div id="view-metas" class="view">
  <h2>🎯 Metas</h2>
  <div class="grid full">
    <input type="text" placeholder="Nombre de la meta" id="goal-name" style="grid-column:1/-1">
    <input type="number" placeholder="Monto objetivo (Q)" id="goal-target">
    <button onclick="addGoal()" style="grid-column:1/-1">Crear meta</button>
  </div>
  <div id="goal-list" style="margin-top:20px"></div>
</div>

<!-- NOTAS -->
<div id="view-notas" class="view">
  <h2>📝 Notas</h2>
  <textarea placeholder="Escribe una nota..." id="note-text" style="min-height:100px"></textarea>
  <button onclick="addNote()" style="width:100%">Guardar nota</button>
  <div id="note-list" style="margin-top:20px"></div>
</div>

<!-- NAV BAR -->
<div class="nav-bar">
  <button class="nav-btn active" onclick="showView('inicio')">🏠</button>
  <button class="nav-btn" onclick="showView('finanzas')">💳</button>
  <button class="nav-btn" onclick="showView('habitos')">🌱</button>
  <button class="nav-btn" onclick="showView('metas')">🎯</button>
  <button class="nav-btn" onclick="showView('notas')">📝</button>
</div>

<script>
// Storage
var data = JSON.parse(localStorage.getItem('hf_data')) || {
  tx: [],
  habits: [],
  goals: [],
  notes: []
};

function save() {
  localStorage.setItem('hf_data', JSON.stringify(data));
  render();
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function addTx() {
  var desc = document.getElementById('tx-desc').value.trim();
  var amt = parseFloat(document.getElementById('tx-amt').value);
  var type = document.getElementById('tx-type').value;
  if (!desc || isNaN(amt) || amt <= 0) { alert('Completa los campos'); return; }
  data.tx.push({id:Date.now(), desc, amt, type, date:new Date().toLocaleDateString()});
  document.getElementById('tx-desc').value = '';
  document.getElementById('tx-amt').value = '';
  save();
}

function addHabit() {
  var name = document.getElementById('hab-name').value.trim();
  if (!name) { alert('Escribe un nombre'); return; }
  data.habits.push({id:Date.now(), name, done:[]});
  document.getElementById('hab-name').value = '';
  save();
}

function addGoal() {
  var name = document.getElementById('goal-name').value.trim();
  var target = parseFloat(document.getElementById('goal-target').value);
  if (!name || isNaN(target) || target <= 0) { alert('Completa los campos'); return; }
  data.goals.push({id:Date.now(), name, target, saved:0});
  document.getElementById('goal-name').value = '';
  document.getElementById('goal-target').value = '';
  save();
}

function addNote() {
  var text = document.getElementById('note-text').value.trim();
  if (!text) { alert('Escribe algo'); return; }
  data.notes.push({id:Date.now(), text, date:new Date().toLocaleDateString()});
  document.getElementById('note-text').value = '';
  save();
}

function render() {
  // Transacciones
  var txList = document.getElementById('tx-list');
  txList.innerHTML = data.tx.length ? '' : '<div class="empty">Sin transacciones</div>';
  data.tx.slice().reverse().forEach(tx => {
    txList.innerHTML += '<div class="card"><p><strong>'+tx.desc+'</strong> ('+tx.type+')</p><p>Q '+tx.amt+' • '+tx.date+'</p><button onclick="delTx('+tx.id+')" style="background:var(--red)">Eliminar</button></div>';
  });

  // Hábitos
  var habList = document.getElementById('hab-list');
  habList.innerHTML = data.habits.length ? '' : '<div class="empty">Sin hábitos</div>';
  data.habits.forEach(h => {
    habList.innerHTML += '<div class="card"><p><strong>'+h.name+'</strong></p><button onclick="toggleHab('+h.id+')">Marcar hoy</button> <button onclick="delHab('+h.id+')" style="background:var(--red)">Eliminar</button></div>';
  });

  // Metas
  var goalList = document.getElementById('goal-list');
  goalList.innerHTML = data.goals.length ? '' : '<div class="empty">Sin metas</div>';
  data.goals.forEach(g => {
    var pct = Math.min(100, (g.saved/g.target)*100);
    goalList.innerHTML += '<div class="card"><p><strong>'+g.name+'</strong></p><p>Q '+g.saved+' de Q '+g.target+' ('+Math.round(pct)+'%)</p><input type="number" placeholder="Ahorrar" id="deposit-'+g.id+'" style="margin-bottom:0"><button onclick="depositGoal('+g.id+')" style="width:100%;margin-top:8px">Ahorrar</button> <button onclick="delGoal('+g.id+')" style="background:var(--red);width:100%;margin-top:4px">Eliminar</button></div>';
  });

  // Notas
  var noteList = document.getElementById('note-list');
  noteList.innerHTML = data.notes.length ? '' : '<div class="empty">Sin notas</div>';
  data.notes.slice().reverse().forEach(n => {
    noteList.innerHTML += '<div class="card"><p>'+n.text+'</p><p style="font-size:12px">'+n.date+'</p><button onclick="delNote('+n.id+')" style="background:var(--red)">Eliminar</button></div>';
  });
}

function delTx(id) { data.tx = data.tx.filter(x => x.id !== id); save(); }
function delHab(id) { data.habits = data.habits.filter(x => x.id !== id); save(); }
function delGoal(id) { data.goals = data.goals.filter(x => x.id !== id); save(); }
function delNote(id) { data.notes = data.notes.filter(x => x.id !== id); save(); }
function toggleHab(id) { data.habits.find(h => h.id === id).done.push(new Date().toLocaleDateString()); save(); }
function depositGoal(id) {
  var amt = parseFloat(document.getElementById('deposit-'+id).value);
  if (isNaN(amt) || amt <= 0) return;
  var g = data.goals.find(x => x.id === id);
  g.saved += amt;
  document.getElementById('deposit-'+id).value = '';
  save();
}

// Init
render();
</script>
</body>
</html>
